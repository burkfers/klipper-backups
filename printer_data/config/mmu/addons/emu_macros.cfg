# === EMU Lane Temperature and Humidity Sensors ===

[temperature_sensor Lane_0]
sensor_type: BME280
i2c_address: 118
i2c_mcu: mmu0
i2c_software_scl_pin: mmu0:MMU_I2C_SCL
i2c_software_sda_pin: mmu0:MMU_I2C_SDA

[temperature_sensor Lane_1]
sensor_type: BME280
i2c_address: 118
i2c_mcu: mmu1
i2c_software_scl_pin: mmu1:MMU_I2C_SCL
i2c_software_sda_pin: mmu1:MMU_I2C_SDA

[temperature_sensor Lane_2]
sensor_type: BME280
i2c_address: 118
i2c_mcu: mmu2
i2c_software_scl_pin: mmu2:MMU_I2C_SCL
i2c_software_sda_pin: mmu2:MMU_I2C_SDA

[temperature_sensor Lane_3]
sensor_type: BME280
i2c_address: 118
i2c_mcu: mmu3
i2c_software_scl_pin: mmu3:MMU_I2C_SCL
i2c_software_sda_pin: mmu3:MMU_I2C_SDA

