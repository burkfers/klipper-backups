[manual_stepper stepper_blobifier]
step_pin: sb2209:STEP
dir_pin: sb2209:DIR
enable_pin: !sb2209:EN
microsteps: 32
endstop_pin: ^sb2209:PROBE1
# position_min: 0
# position_max: 15
rotation_distance: 60
velocity: 200
accel: 9000

[tmc2209 manual_stepper stepper_blobifier]
uart_pin: sb2209:CS
run_current: 0.5
hold_current: 0.1
sense_resistor: 0.110
stealthchop_threshold: 99999999

[gcode_macro _BLOBIFIER_HOME]
description: Pull back to -15mm, then set that point as 0s
gcode:
  MANUAL_STEPPER STEPPER=stepper_blobifier ENABLE=1 SET_POSITION=30 SYNC=1
  MANUAL_STEPPER STEPPER=stepper_blobifier MOVE=0 SPEED=50 STOP_ON_ENDSTOP=2

# --- Fully extend to +15mm ---
[gcode_macro _BLOBIFIER_EXTEND]
description: Extend blobifier to +15mm (fully out). If disabled, home first.
gcode:
  {% if not printer.stepper_enable.steppers['manual_stepper stepper_blobifier'] %}
    _BLOBIFIER_HOME
  {% endif %}
  MANUAL_STEPPER STEPPER=stepper_blobifier MOVE=22 SPEED=50 SYNC=1
  MANUAL_STEPPER STEPPER=stepper_blobifier ENABLE=0


# --- Retract to 0mm (inside) ---
[gcode_macro _BLOBIFIER_RETRACT]
description: Retract blobifier to 0mm (inside). If disabled, home first.
gcode:
  {% if not printer.stepper_enable.steppers['manual_stepper stepper_blobifier'] %}
    _BLOBIFIER_HOME
  {% endif %}
  MANUAL_STEPPER STEPPER=stepper_blobifier MOVE=0 SPEED=50 SYNC=1
  MANUAL_STEPPER STEPPER=stepper_blobifier ENABLE=0
