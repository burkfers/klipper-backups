[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /home/brm/printer_data/comms/klippy.sock

[authorization]
trusted_clients:
    127.0.0.0/8
    192.168.0.0/16
cors_domains:
    *.lan
    *.local
    *://localhost
    *://localhost:*
    *://my.mainsail.xyz
    *://app.fluidd.xyz
    
[octoprint_compat]

[history]

[update_manager]
channel: dev
refresh_interval: 168

[update_manager fluidd]
path: /home/brm/fluidd
repo: fluidd-core/fluidd
channel: stable
type: web
persistent_files:
    config.json
    
[update_manager fluidd-config]
managed_services: klipper
origin: https://github.com/fluidd-core/fluidd-config.git
path: /home/brm/fluidd-config
primary_branch: master
type: git_repo

[update_manager KlipperScreen]
install_script: /home/brm/KlipperScreen/scripts/KlipperScreen-install.sh
requirements: /home/brm/KlipperScreen/scripts/KlipperScreen-requirements.txt
env: /home/brm/.KlipperScreen-env/bin/python
managed_services: KlipperScreen
origin: https://github.com/KlipperScreen/KlipperScreen.git
path: /home/brm/KlipperScreen
type: git_repo

[update_manager update_klipper_and_mcus]
type: git_repo
primary_branch: main
path: ~/ukam
origin: https://github.com/fbeauKmi/update_klipper_and_mcus.git
is_system_service: False
