[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /home/brm/printer_data/comms/klippy.sock

[authorization]
trusted_clients:
    127.0.0.0/8
    192.168.0.0/16
cors_domains:
    *.lan
    *.local
    *://localhost
    *://localhost:*
    *://my.mainsail.xyz
    *://app.fluidd.xyz
    
[octoprint_compat]

[history]

[analysis]
enable_auto_analysis: true
enable_estimator_updates: true

[spoolman]
server: http://spoolman.btz
sync_rate: 5

[webcam Camera]
service: mjpegstreamer-adaptive
location: dunno
target_fps_idle: 1
stream_url: /webcam?action=stream
snapshot_url: /webcam/?action=snapshot

[file_manager]
enable_object_processing: True
queue_gcode_uploads: True

[update_manager]
channel: dev
refresh_interval: 168

[update_manager klipper-backup]
type: git_repo
path: ~/klipper-backup
origin: https://github.com/Staubgeborener/klipper-backup.git
managed_services: moonraker
primary_branch: main

[update_manager fluidd-config]
managed_services: klipper
origin: https://github.com/fluidd-core/fluidd-config.git
path: /home/brm/fluidd-config
primary_branch: master
type: git_repo

[update_manager KlipperScreen]
install_script: /home/brm/KlipperScreen/scripts/KlipperScreen-install.sh
requirements: /home/brm/KlipperScreen/scripts/KlipperScreen-requirements.txt
env: /home/brm/.KlipperScreen-env/bin/python
managed_services: KlipperScreen
origin: https://github.com/moggieuk/KlipperScreen-Happy-Hare-Edition.git
path: /home/brm/KlipperScreen
type: git_repo

[update_manager update_klipper_and_mcus]
type: git_repo
primary_branch: main
path: ~/ukam
origin: https://github.com/fbeauKmi/update_klipper_and_mcus.git
is_system_service: False

## Klippain Shake&Tune automatic update management
[update_manager Klippain-ShakeTune]
type: git_repo
origin: https://github.com/Frix-x/klippain-shaketune.git
path: ~/klippain_shaketune
virtualenv: /home/brm/klippy-env
requirements: requirements.txt
system_dependencies: system-dependencies.json
primary_branch: main
managed_services: klipper

[update_manager cartographer_plugin]
type: python
channel: stable
virtualenv: ~/klippy-env
project_name: cartographer3d-plugin
is_system_service: False
managed_services: klipper
info_tags: desc=Cartographer


[update_manager led_effect]
type: git_repo
path: ~/klipper-led_effect
origin: https://github.com/julianschill/klipper-led_effect.git
is_system_service: False



# Crowsnest update_manager entry
[update_manager crowsnest]
type: git_repo
path: ~/crowsnest
origin: https://github.com/mainsail-crew/crowsnest.git
managed_services: crowsnest
install_script: tools/pkglist.sh

[update_manager happy-hare]
type: git_repo
path: ~/Happy-Hare
origin: https://github.com/moggieuk/Happy-Hare.git
primary_branch: main
managed_services: klipper

[mmu_server]
enable_file_preprocessor: True
enable_toolchange_next_pos: True
update_spoolman_location: True

[update_manager klipper_tmc_autotune]
type: git_repo
channel: dev
path: ~/klipper_tmc_autotune
origin: https://github.com/andrewmcgr/klipper_tmc_autotune.git
managed_services: klipper
primary_branch: main
install_script: install.sh

[update_manager fluidd]
path: /home/brm/fluidd
repo: fluidd-core/fluidd
channel: stable
type: web
persistent_files:
    config.json

[update_manager Happy-Hare-RFID-Reader]
type:             git_repo
path:             /home/brm/rfid-reader
origin:           https://github.com/cwiegert/Happy-Hare-RFID-Reader.git
primary_branch:   main
managed_services: klipper
install_script:   install.sh
info_tags:        desc=EMU NFC Gate Reader for Happy Hare
