[gcode_macro _set_nozzle_leds]
gcode:
  {% set tool = params.TOOL|default(0)|int %}
  {% set enable = params.ENABLE|default(0)|int %}

  {% if enable %}
    {% set white = 0.8 %}
  {% else %}
    {% set white = 0 %}
  {% endif %}
  SET_LED LED=T{tool}_leds RED=0 GREEN=0 BLUE=0 WHITE={white} INDEX=2 TRANSMIT=0
  SET_LED LED=T{tool}_leds RED=0 GREEN=0 BLUE=0 WHITE={white} INDEX=3 TRANSMIT=1

[gcode_macro _set_logo_led]
gcode:
  {% set tool = params.TOOL|default(0)|int %}
  {% set enable = params.ENABLE|default(0)|int %}

  {% if enable %}
    SET_LED LED=T{tool}_leds RED=0.5 GREEN=0.25 BLUE=0 WHITE=0 INDEX=1
  {% else %}
    SET_LED LED=T{tool}_leds RED=0.08 GRERE=0.03 BLUE=0 WHITE=0 INDEX=1
  {% endif %}
