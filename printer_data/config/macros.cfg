[gcode_macro _CG28]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

[gcode_macro _CQGL]
gcode:
    {% if printer.quad_gantry_level.applied == False %}
    	_CG28 ; home if not already homed
        #QUAD_GANTRY_LEVEL
	    QUAD_GANTRY_LEVEL horizontal_move_z=10 retries=0 retry_tolerance=1.000
    	QUAD_GANTRY_LEVEL horizontal_move_z=3
        G28 Z
    {% endif %}
    

[gcode_macro _ENSURE_EXTRUDER_TEMP]
gcode:
  {% set min_temp = params.MIN_TEMP|default(200)|int %}
  {% set target_temp = params.TARGET_TEMP|default(230)|int %}

  {% if printer.extruder.target > min_temp %}
    {% if printer.extruder.temperature < min_temp %}
      M109 S{printer.extruder.target}
    {% endif %}
  {% else %}
    M109 S{target_temp}
  {% endif %}


[gcode_macro LOAD_FILAMENT]
gcode:
  SAVE_GCODE_STATE NAME=load_state
  _status_busy
  
  _ENSURE_EXTRUDER_TEMP
  
  G91
  G92 E0
  G1 E10 F200                    ; slow roll 10mm
  G1 E45 F1500                   ; fast approach meltzone
  G1 E30 F200                    ; prime nozzle with filament
  _status_ready
  RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
gcode:

  _ENSURE_EXTRUDER_TEMP

  SAVE_GCODE_STATE NAME=unload_state
  _status_busy
  G91
  G92 E0
  # G1 E10 F300                    ; extrude a little to soften tip
  # G1 E-10 F3000                  ; jerk the filament out of the melt zone
  # G1 E-50 F1800                  ; retract the rest of the way
  # G1 E-10 F900                   ; retract the rest of the way

  G0 E10 F360                      ; dip the tip in                                          
  G0 E5 F2400                      ; dunk the tip                                          
  G0 E-5 F2400                     ; pull out quickly
  G0 E-10 F120                     ; let the tip cool a little
  G0 E-80 F3600                    ; send it on its way!              

  CLEAR_ACTIVE_SPOOL
  _status_ready
  RESTORE_GCODE_STATE NAME=unload_state

[gcode_macro M600]
gcode:
  PAUSE LEAVEHOTENDON=1
#  {% set resume = printer['gcode_macro RESUME'] %}
#  M109 S{resume.etemp|int}
  UNLOAD_FILAMENT

[gcode_macro PARK_FRONT]
gcode:
  _CG28
  _CQGL
  G91
  G0 Z10 F1800
  G90
  G0 X150 Y5 Z100 F12000

[gcode_macro PARK]
variable_default_park_x: 290
variable_default_park_y: 290
gcode:
    {% set park_x = params.X|default(default_park_x)|int %}
    {% set park_y = params.Y|default(default_park_y)|int %}

    {% set noz = params.NO_Z|default(0)|int %}

    _CG28
    _CQGL
    {% if printer.toolhead.position.x != park_x or printer.toolhead.position.y != park_y %}
      G91
      G1 Z20 F2400       ; hop for safety
      G90
    G1 X{park_x} Y{park_y} F12000
    {% endif %}
    {% if noz <= 0 %}
    	G1 Z10 F2400 
    {% endif %}

[gcode_macro G28]
rename_existing: G9928
gcode:
    _status_homing
    G9928 { rawparams }
    _status_ready 

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: QUAD_GANTRY_LEVEL_1
gcode:
  {% if printer["gcode_macro _status_leveling"] != null %}
    _status_leveling
  {% endif %}
    QUAD_GANTRY_LEVEL_1 { rawparams }
  {% if printer["gcode_macro _status_ready"] != null %}
    _status_ready
  {% endif %}

[delayed_gcode _PRINT_END_DELAYED]
gcode:
    # SET_FAN_SPEED FAN=filter SPEED=0
    _status_ready


# Blocking temperate to temperature_wait - Doesn't wait as long for stabilization
[gcode_macro M109]
rename_existing: M99109
gcode:
    #Parameters
    {% set s = params.S|float %}
    
    M104 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}  ; Set hotend temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={s} MAXIMUM={s+1}   ; Wait for hotend temp (within 1 degree)
    {% endif %}
[gcode_macro M190]
rename_existing: M99190
gcode:
    #Parameters
    {% set s = params.S|float %}

    M140 {% for p in params %}{'%s%s' % (p, params[p])}{% endfor %}   ; Set bed temp
    {% if s != 0 %}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s} MAXIMUM={s+1}  ; Wait for bed temp (within 1 degree)
    {% endif %}

[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method(
       "spoolman_set_active_spool",
       spool_id=id
    )}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method(
    "spoolman_set_active_spool",
    spool_id=None
  )}

[gcode_macro FLASH_LIGHTS]
gcode:
        {% set prev = printer["output_pin daylight"].value %}
		{% for i in range(3) %}
        	SET_PIN PIN=daylight VALUE=1
        	G4 P150
        	SET_PIN PIN=daylight VALUE={prev}
        	G4 P100
		{% endfor %}


[gcode_macro M106]
rename_existing: M10699
gcode:
	{% if (params.P|int if params.P is defined else 0) != 3 %}
		# {% set fan = 'fan' + (params.P|int if params.P is defined else 0)|string %}
    	{% set speed = (params.S|int if params.S is defined else 255) %}
	    #SET_FAN_SPEED FAN=fan SPEED={speed}
		M10699 S{speed}
	{% endif %}

[gcode_macro M107]
rename_existing: M10799
gcode:
	{% if (params.P|int if params.P is defined else 0) != 3 %}
		M10799
	{% endif %}

[gcode_macro cooldown]
gcode:
	M104 S0 ; extruder off
	M140 S0 ; bed off

[gcode_macro LIGHTS]
gcode:
	LIGHTS_HIGH
  _SET_NOZZLE_LEDS_ON
[gcode_macro LIGHTS_HIGH]
gcode:
	SET_PIN PIN=daylight VALUE=0.6
[gcode_macro LIGHTS_MEDIUM]
gcode:
	SET_PIN PIN=daylight VALUE=0.3
[gcode_macro LIGHTS_LOW]
gcode:
	SET_PIN PIN=daylight VALUE=0.15

[gcode_macro KOMB_TEMP]
gcode:
  {% set temp = params.TEMP|default(200)|int %}
  {% set prevtemp = [printer.extruder.target,140]|max %}
	M104 S{temp}
  PARK_ON_NOZZLE_STOP
	TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp-5} MAXIMUM={temp+5}
	KOMB
	M104 S{prevtemp}
  PARK_ON_NOZZLE_STOP
	TEMPERATURE_WAIT SENSOR=extruder MINIMUM={prevtemp-5} MAXIMUM={prevtemp+5}

[gcode_macro park_on_nozzle_stop]
variable_stop_pos_x:  60
variable_stop_pos_y: 297
variable_movespeed: 12000
gcode:
    G90
    {% if printer.toolhead.position.z < 10 %}
      G0 Z10
    {% endif %}
    {% if printer.toolhead.position.y > stop_pos_y - 10 %}
      G0 Y{stop_pos_y-10} F{movespeed}
    {% endif %}
    G0 X{stop_pos_x-10} Y{stop_pos_y} F{movespeed}
    G0 Y{stop_pos_y} F{movespeed}
    G0 X{stop_pos_x} F{movespeed}
