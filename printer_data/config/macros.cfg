[gcode_macro ENSURE_PROBE]
gcode:
    M118 actve tool: {printer.tool_probe_endstop.active_tool_number|int}
    {% if printer.tool_probe_endstop.active_tool_number | int == -1 %}
      {% if "xy" not in printer.toolhead.homed_axes %}
        G28 X Y
      {% endif %}
      G90
      G0 X90 Y90 F15000
      INITIALIZE_TOOLCHANGER
      SELECT_TOOL T=0 RESTORE_AXIS=XY
    {% endif %}

[gcode_macro _CG28]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}

[gcode_macro _CQGL]
gcode:
  {% if not printer.quad_gantry_level.applied %}
    ENSURE_PROBE 
    _CG28
    # UNSELECT_TOOL
    # T0
    # G90
    # G0 X90 Y100
    STOP_TOOL_PROBE_CRASH_DETECTION
    # PROBE_ACCURACY
    QUAD_GANTRY_LEVEL
    G28 Z
    #START_TOOL_PROBE_CRASH_DETECTION T={printer.tool_probe_endstop.active_tool_number | int}
  {% endif %}


#####################################################################
#   Print Start
#####################################################################

#print_start tool_0_start={first_layer_temperature[0]} tool_1_start={first_layer_temperature[1]} BED={first_layer_bed_temperature[0]} initial_tool={initial_tool} isT0={is_extruder_used[0]} isT1{is_extruder_used[1]}

[gcode_macro print_start]
gcode:
  {% set t0_start = params.TOOL_0_START %}
  {% set t1_start = params.TOOL_1_START %}
  {% set bed_temp = params.BED %}
  {% set t0_used = params.IST0|upper %}
  {% set t1_used = params.IST1|upper %}
  {% set chamber_temp = params.CHAMBER|default(0)|float %}
  {% set initial_tool = params.INITIAL_TOOL|default(-1)|int %}
  # Head off tool head heatup to prevent oozing
  #{% if t1_used == "TRUE" %}
  #  M104 S150 T1
  #{% endif %}
  # Always head off T0, it is the probing tool head.
  M104 S150 T0

  SET_DISPLAY_TEXT MSG="Bed: {bed_temp}c"             # Display info on display
  # Check if the bed temp is higher than 90c - if so then trigger a heatsoak and toggle filter.
  {% if bed_temp|int > 90 %}
    #M106 S255                                           # Turn on the part cooling fan
    ##  Uncomment if you have a filter.
    TOGGLE_FILTER                                      # Turn on the filter
    M140 S{bed_temp}                                  # Set the target temp for the bed
    ##  Uncomment if you have bed fans.
    HEATSOAK_CHAMBER CHAMBER_TEMP={chamber_temp} 
  {% endif %}
  M190 S{bed_temp}                                   # Set the target temp for the bed
  # Make sure T0 is at probing temps before moving forward.
  SET_DISPLAY_TEXT MSG="T0: 150c"             # Display info on display
  M109 S150 T0
  # Home the printer if not already done. 
  SET_DISPLAY_TEXT MSG="Homing"             # Display info on display
  _CG28
  T0
  SET_DISPLAY_TEXT MSG="Leveling"             # Display info on display
  _CQGL
  #BED_MESH_CALIBRATE ADAPTIVE=1
  
  #G0 X90 Y25 F12000
  #G0 Z0.05 # set nozzle onto plate to stop ooze
  UNSELECT_TOOL # dock tool to place it on the nozzle stop
  
  SET_DISPLAY_TEXT MSG="Tools: {t0_start}, {t1_start}"             # Display info on display
  # Heat up only the nozzles used to printing temp
  {% if t1_used == "TRUE" %}
    M104 S{t1_start} T1
    {% if t0_used == "TRUE" %}
      M109 S{t0_start} T0
    {% else %}
      M104 S0 T0
      M109 S{t1_start} T1
    {% endif %}
  {% else %}
    M104 S0 T1
    M109 S{t0_start} T0
  {% endif %}
  
  SET_DISPLAY_TEXT MSG="Priming"             # Display info on display
  # Here is wher I prime the used tools and set the first one used as the last one primed.
  # If T1 is used and T0 is the starting tool, prime T1 first.
  {% if t1_used == "TRUE" and params.INITIAL_TOOL|int == 0 %}
    # Switch to T1 and prime
    RESPOND MSG="Priming T1 and T0"
    T1
    PRIME_ACTIVE_TOOL T=1
    M104 T1 S{t1_start|int-30}
    T0
    PRIME_ACTIVE_TOOL T=0
  # If T1 is used and T1 is the starting tool
  {% elif t1_used =="TRUE" and params.INITIAL_TOOL|int == 1 %}
    # If T0 is used, prime it first
    {% if t0_used == "TRUE" %}
      RESPOND MSG="Priming T0 and T1"
      T0
      PRIME_ACTIVE_TOOL T=0
      M104 T0 S{t0_start|int-30}
      T1
      PRIME_ACTIVE_TOOL T=1
    {% else %}
      # T0 is not used, prime T1 only
      RESPOND MSG="Priming T1"
      T1
      PRIME_ACTIVE_TOOL T=1
    {% endif %}
  {% else %}
    # T1 is NOT used in the print, prime T0 only
    RESPOND MSG="Priming T0"
    T0
    PRIME_ACTIVE_TOOL T=0
  {% endif %}

  SET_DISPLAY_TEXT MSG="What DOOOIII-"             # Display info on display

#####################################################################
#  Printer End
#####################################################################

[gcode_macro print_end]
gcode:
    # Move up by 5mm
    G91
    G0 Z5
    G90

    # Retract an extra 5mm, try to help oozing
    G0 E-5

    # Turn off heaters
    TURN_OFF_HEATERS
    # Turn off part fans
    M107

    # Play a jingle
    _MUSIC_MARIO
    T0
    # Move toolhead to the rear
    G0 Y185 X90 F15000

    # Turn off motors
    M84

[gcode_macro prime_active_tool]
gcode:
    {% set tool = params.T|int %}
    RESPOND MSG="Tool: {tool}"
    # Print the perimeter and left side with T0
    {% if tool == 0 %}
      _PRIME_LEFT
    {% else %}
      _PRIME_RIGHT
    {% endif %}
    G90
    G0 X90 Y90 Z5 F9000

[gcode_macro _prime_left]
gcode:
  G21 ; set units to millimeters
  G90 ; use absolute coordinates
  M83 ; use relative distances for extrusion
  G0 X70 Y30 F9000
  _MICRON_PURGE

[gcode_macro _prime_right]
gcode:
  G21 ; set units to millimeters
  G90 ; use absolute coordinates
  M83 ; use relative distances for extrusion
  G0 X102 Y30 F9000
  _MICRON_PURGE


[gcode_macro _MICRON_PURGE]
gcode:
  G90
  G92 E0.0 ; reset extruder
  G1 Z0.8 F6000.0
  G91 ; Relative Movement
  G1 X8.75 Y15 E17.37 F360.0 
  G92 E0.0 ; reset extruder
  G1 X-4.47 Y-8.505 F360.0
  G1 X9 E9 F360.0
  G92 E0.0 ; reset extruder
  G1 X-3 F360.0
  G1 X4.96 Y8.505 E9.85 F360.0
  G1 E-0.5 F2100 ; small retraction
  G92 E0.0 ; reset extruder
  G90

[gcode_macro TOGGLE_FILTER]
gcode:
  {% if printer['fan_generic filter'].speed > 0 %}
    SET_FAN_SPEED FAN=filter SPEED=0
  {% else %}
    SET_FAN_SPEED FAN=filter SPEED=1
  {% endif %}

[gcode_macro SET_CHAMBER]
gcode:
  {% set target_chamber = params.CHAMBER_TEMP|default(0)|float %}
  SET_HEATER_TEMPERATURE heater=chamber target={target_chamber}

[gcode_macro HEATSOAK_CHAMBER]
gcode:
  {% set target_chamber = params.CHAMBER_TEMP|default(0)|float %}
  SET_DISPLAY_TEXT MSG="Heatsoak: {target_chamber}c"  # Display info on display
  {% if target_chamber > 0 and not printer["heater_generic chamber"].temperature >= target_chamber|float%} #wait for chamber temps
    SET_CHAMBER CHAMBER_TEMP={target_chamber+1} #+1 °C for faster temp target arrival
    M106 S204 #part cooling fan 80%
    TEMPERATURE_WAIT SENSOR="heater_generic chamber" MINIMUM={target_chamber-0.1} #wait until chamber temp is very nearly reached
    SET_CHAMBER CHAMBER_TEMP={target_chamber} #set correct chamber target and let PID do its magic
  {% endif %}

  #in case chamber was already heated
  {% if target_chamber > 0 %}
    SET_CHAMBER CHAMBER_TEMP={target_chamber} 
  {% endif %}  # Waits for chamber temp

[gcode_macro SEARCH_VARS]
gcode:
    {% set search = params.S|lower %}
    {% set ns = namespace() %}
    {% for item in printer  %}
        {% if ' ' in item %}
            {% set ns.path = ['printer', "['%s']" % (item), ''] %}
        {% else %}
            {% set ns.path = ['printer.', item, ''] %}   
        {% endif %} 

        {% if search in ns.path|lower %}
            { action_respond_info(ns.path|join) }
        {% endif %} 

        {% if printer[item].items() %}
            {% for childkey, child in printer[item].items() recursive %}
                {% set ns.path = ns.path[:loop.depth|int + 1] %}

                {% if ' ' in childkey %}
                    {% set null = ns.path.append("['%s']" % (childkey)) %}
                {% else %}
                    {% set null = ns.path.append(".%s" % (childkey)) %}
                {% endif %} 

                {% if child is mapping  %}
                    { loop(child.items()) }
                {% else %}
                    {% if search in ns.path|lower %}
                        { action_respond_info("%s : %s" % (ns.path|join, child)) }   
                    {% endif %} 
                {% endif %} 
                
            {% endfor %}
        {% endif %} 
    {% endfor %}
