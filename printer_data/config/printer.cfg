[mcu]
canbus_uuid:f680cead16b6
canbus_interface: can1

[virtual_sdcard]
path: /home/brm/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: corexy
max_velocity: 600#1000
max_accel: 20000#34000
max_z_velocity: 35
#max_z_velocity: 30
max_z_accel: 350
square_corner_velocity: 10
minimum_cruise_ratio: 0.30 #0.5

# [safe_z_home]
# home_xy_position: 150,150
# speed: 200
# z_hop: 10
# z_hop_speed: 30

[homing_override]
gcode:
  {% if 'X' not in params and 'Y' not in params and 'Z' not in params %}
    {% set params = 'XYZ' %}
  {% endif %}
  {% set homed_axes = printer.toolhead.homed_axes %}
  {% if 'z' not in printer.toolhead.homed_axes %}
    SET_KINEMATIC_POSITION Z=0
    G91
    G1 Z10 F2000
    G90
    {% if 'Z' not in params %}
      M84 # not homing Z? release again, set_kinematic_position is not safe!
      {% set homed_axes = '' %} # clear homed axes; the original isn't reevaluated
    {% endif %}
  {% endif %}
  {% if 'Y' in params or (('X' in params or 'Z' in params) and 'y' not in homed_axes) %}
    # home Y if requested, or if it's not homed and X or Z are requested
    G28 Y
  {% endif %}
  {% if 'X' in params or ('Z' in params and 'x' not in homed_axes) %}
    # home X if requested or if it's not homed and Z is requested
    G0 Y{printer.toolhead.axis_maximum.y} F12000 # must sit at Ymax to home
    G28 X
  {% endif %}
  {% if 'Z' in params %}
    # home z only if requested
    G0 X150 Y150 F12000
    G28 Z
    G0 Z10 F2000
  {% endif %}

[exclude_object]

### Input Shaping

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 74
damping_ratio_x: 0.066
shaper_type_y: mzv
shaper_freq_y: 57
damping_ratio_y: 0.054

[shaketune]
max_freq: 200

[gcode_arcs]
resolution: 0.1

#####################################################################
#       Auto speed
#####################################################################

[auto_speed]
#axis: diag_x, diag_y  ; One or multiple of `x`, `y`, `diag_x`, `diag_y`, `z`

margin: 100             ; How far away from your axes to perform movements

#settling_home: 1      ; Perform settling home before starting Auto Speed
#max_missed: 1.0       ; Maximum full steps that can be missed
#endstop_samples: 3    ; How many endstop samples to take for endstop variance

#accel_min: 1000.0     ; Minimum acceleration test may try
#accel_max: 50000.0    ; Maximum acceleration test may try
#accel_accu: 0.05      ; Keep binary searching until the result is within this percentage

#velocity_min: 50.0    ; Minimum velocity test may try
#velocity_max: 5000.0  ; Maximum velocity test may try
#velocity_accu: 0.05   ; Keep binary searching until the result is within this percentage

#derate: 0.8           ; Derate discovered results by this amount

#validate_margin: Unset      ; Margin for VALIDATE, Defaults to margin
validate_inner_margin: 75.0 ; Margin for VALIDATE inner pattern
#validate_iterations: 50     ; Perform VALIDATE pattern this many times

#results_dir: ~/printer_data/config ; Destination directory for graphs

