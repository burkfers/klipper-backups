#####################################################################
# 	Bed Heater
#####################################################################

[heater_bed]
##	SSR Pin - HE1
heater_pin: PB5 
## Check what thermistor type you have. See https://www.klipper3d.org/Config_Reference.html#common-thermistors for common thermistor types.
## Use "Generic 3950" for NTC 100k 3950 thermistors
sensor_type: Generic 3950
sensor_pin: PA0
##  Adjust max_power so it doesn't exceed the SSR rating. The Omron G3NA-210B-DC5 SSR is rated at 4 amps without a heatsink.
##  The formula is "4 / (Wattage_of_bed_heater / Mains_voltage) = max_power"
##  10A / (650W / 220V) = 
##  If max_power is greater than 1.0, use 1.0
max_power: 1.0  # 1.0
min_temp: 0
max_temp: 120
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

#####################################################################
#       Fans
#####################################################################

# [temperature_sensor chamber]
# sensor_type: Generic 3950
# sensor_pin: PA1
# max_temp: 70
# [fan_generic bed]
# pin: PE4
# kick_start_time: 1.0
[heater_generic chamber]
heater_pin: PE4
sensor_type: Generic 3950
sensor_pin: PA1
control: pid
pid_Kp: 61.470837
pid_Ki: 0.5
pid_Kd: 0
pwm_cycle_time: 0.3
min_temp: -273.15
max_temp: 75
gcode_id: C

[verify_heater chamber]
max_error: 120
check_gain_time: 240
hysteresis: 50
heating_gain: 1

[temperature_sensor b_motor]
sensor_type: Generic 3950
sensor_pin: PA2
max_temp: 100

[temperature_sensor a_motor]
sensor_type: Generic 3950
sensor_pin: PA3
max_temp: 100

[temperature_sensor mcu]
sensor_type: temperature_mcu
max_temp: 100

[temperature_sensor carto]
sensor_type: temperature_mcu
sensor_mcu: carto
min_temp: 0
max_temp: 105

#[fan_generic exhaust_fan]
#pin: PE5 # Exhaust
#kick_start_time: 0.5

#[fan_generic filter]
#pin: PE6 # Nevermore
#kick_start_time: 1.0

[controller_fan electronics_fans]
pin: PE0
max_power: 0.8
heater: heater_bed, extruder
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, stepper_z2, stepper_z3

# [fan_generic electronics_aux_fans]
# pin: PC12

# [fan_generic driver_fan]
# pin: PE5
[controller_fan drivers_fan]
pin: PE5
max_power: 0.8
stepper: stepper_x, stepper_y, stepper_z, stepper_z1, stepper_z2, stepper_z3

[temperature_fan host]
pin: PC12
kick_start_time: 2
target_temp: 65
min_speed: 0.5
max_speed: 0.8
sensor_type: temperature_host
control: watermark
max_delta: 3
min_temp: 0
max_temp: 90

[nevermore]
bt_address: 28:CD:C1:01:D0:53
fan_power_passive: 0
fan_power_automatic: 0.5
fan_power_coefficient: 0.8  # lower max power to keep things much more quiet
fan_thermal_limit_temperature_min: 60
fan_thermal_limit_temperature_max: 70
fan_thermal_limit_coefficient: 0.5
fan_policy_cooldown: 600
fan_policy_voc_passive_max: 300
fan_policy_voc_improve_min: 0
print_mode_min_bed_target: 90

[multi_pin daylight_pins]
pins: PB6, PE1

[output_pin daylight]
pin: multi_pin:daylight_pins
pwm: true
shutdown_value: 0
cycle_time: 0.01
value: 0.15

#[filter_monitor filter_monitor]
#fan: fan_generic filter
#max_runtime_hours: 50 # Defaults to 50 hours
#max_days: 45 # Defaults to 30 days
#interval: 30 # Defaults to 30 seconds
#stats_caption: "Filtration medium at"
## Output override for FILTER_STATS macro. Defaults to "<filter_name> at". e.g. Air Filter at 98%
## expiry_gcode: # Executed when filter meets threshold condition


#####################################################################
#       Quad Gantry Leveling
#####################################################################
[quad_gantry_level]
gantry_corners:
	-60,-10
	360,370
points:
	 40,  10  #50,25
	 40, 240 #50,225
	260, 240 #250,225
	260,  10 #250,25
speed: 300
horizontal_move_z: 20
retries: 8
retry_tolerance: 0.0075
#retry_tolerance: 0.0126
max_adjust: 15
adaptive_horizontal_move_z: true
min_horizontal_move_z: 0.5

#####################################################################
#       Scanner
#####################################################################

[mcu carto]
canbus_uuid:9a1116d82a02

[scanner]
mcu: carto
x_offset: 0                          
#    adjust for your cartographers offset from nozzle to middle of coil
y_offset: 27#24.4                         
#    adjust for your cartographers offset from nozzle to middle of coil
#backlash_comp: 0.5
backlash_comp: 0.03
#   Backlash compensation distance for removing Z backlash before measuring
#   the sensor response.
# 
#   Offsets are measured from the centre of your coil, to the tip of your nozzle 
#   on a level axis. It is vital that this is accurate. 
#mode: touch
#    leave this as touch unless you want to use scan only for everything. 
sensor: cartographer
#    this must be set as cartographer unless using IDM etc.
sensor_alt: carto
#    alternate name to call commands. CARTO_TOUCH etc
#scanner_touch_z_offset: 0.05         
#    This is the default and will be overwritten and added to the DO NOT SAVE area by using UI to save z offset
mesh_runs: 2
#    Number of passes to make during mesh scan.
speed: 8
lift_speed: 30
scanner_touch_tolerance: 0.012 # 0.008

[bed_mesh]
zero_reference_position: 150, 150
speed: 300
#speed: 75
horizontal_move_z: 5
mesh_min: 50, 30
mesh_max: 250, 260
algorithm: bicubic
#probe_count: 10, 10
probe_count: 7, 7

[resonance_tester]
accel_chip: adxl345
# accel_chip: lis2dw
probe_points:
    150, 150, 35
sweeping_period: 0

