[include fluidd.cfg]
[include boards/m8pv2.cfg]
[include boards/ebb36.cfg]
[include homing_override.cfg]
[include bed_fans.cfg]
[include klipper-toolchanger/macros.cfg]
[include klipper-toolchanger/tool_detection.cfg]
[include klipper-toolchanger/toolchanger.cfg]
[include macros.cfg]
[include klipper-toolchanger/calibrate_offsets.cfg]
[include led.cfg]

[mcu]
canbus_uuid: 1240e1d83c52

[mcu T0]
canbus_uuid: 1b225030602a
[include klipper-toolchanger/T0.cfg]

[mcu T1]
canbus_uuid: 2641b8411b76
[include klipper-toolchanger/T1.cfg]

[virtual_sdcard]
path: /home/brm/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 10000
max_z_velocity: 35
max_z_accel: 350
square_corner_velocity: 5
minimum_cruise_ratio: 0.30

# [probe]
# pin: ^T0:PROBE
# x_offset: 0
# y_offset: 0
# speed: 10
# lift_speed: 20
# z_offset: 0
# samples: 2
# samples_tolerance: 0.05
# samples_tolerance_retries: 3

[force_move]
enable_force_move: True

[save_variables]
filename: ~/printer_data/config/save_variables.cfg

[shaketune]

[exclude_object]

[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos  : True  ; use custom park coordinates for x,y [True/False] 
variable_custom_park_x   : 90.0 ; custom x position; value must be within your defined min and max of X
variable_custom_park_y   : 180.0  ; custom y position; value must be within your defined min and max of Y
variable_custom_park_dz   : 10.0   ; custom dz value; the value in mm to lift the nozzle when move to park position
#variable_retract          : 1.0   ; the value to retract while PAUSE
variable_cancel_retract   : 5.0   ; the value to retract while CANCEL_PRINT
#variable_speed_retract    : 35.0  ; retract speed in mm/s
#variable_unretract        : 1.0   ; the value to unretract while RESUME
#variable_speed_unretract  : 35.0  ; unretract speed in mm/s
#variable_speed_hop        : 15.0  ; z move speed in mm/s
#variable_speed_move       : 100.0 ; move speed in mm/s
variable_park_at_cancel   : True ; allow to move the toolhead to park while execute CANCEL_PRINT [True/False]
variable_park_at_cancel_x : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
variable_park_at_cancel_y : None  ; different park position during CANCEL_PRINT [None/Position as Float]; park_at_cancel must be True
## !!! Caution [firmware_retraction] must be defined in the printer.cfg if you set use_fw_retract: True !!!
#variable_use_fw_retract   : False ; use fw_retraction instead of the manual version [True/False]
#variable_idle_timeout     : 0     ; time in sec until idle_timeout kicks in. Value 0 means that no value will be set or restored
#variable_runout_sensor    : ""    ; If a sensor is defined, it will be used to cancel the execution of RESUME in case no filament is detected.
##                                   Specify the config name of the runout sensor e.g "filament_switch_sensor runout". Hint use the same as in your printer.cfg
## !!! Custom macros, please use with care and review the section of the corresponding macro.
## These macros are for simple operations like setting a status LED. Please make sure your macro does not interfere with the basic macro functions.
## Only  single line commands are supported, please create a macro if you need more than one command.
#variable_user_pause_macro : ""    ; Everything insight the "" will be executed after the klipper base pause (PAUSE_BASE) function
#variable_user_resume_macro: ""    ; Everything insight the "" will be executed before the klipper base resume (RESUME_BASE) function
#variable_user_cancel_macro: ""    ; Everything insight the "" will be executed before the klipper base cancel (CANCEL_PRINT_BASE) function
gcode:

#######################
# Temperature Sensors #
#######################

[temperature_sensor MCU]
sensor_type: temperature_mcu

[temperature_sensor SoC]
sensor_type: temperature_host

################
# X/Y Steppers #
################

[stepper_x]
step_pin: M1_STEP
dir_pin: M1_DIR
enable_pin: !M1_EN
microsteps: 32
rotation_distance: 32
endstop_pin: ^M1_STOP
full_steps_per_rotation: 200
position_min: 0
homing_positive_dir: true
homing_retract_dist: 5
position_endstop: 171
position_max: 171
homing_speed: 80#20

[tmc2240 stepper_x]
cs_pin: M1_CS
#spi_bus: spi1
spi_software_sclk_pin: SCLK
spi_software_mosi_pin: MOSI
spi_software_miso_pin: MISO
rref: 12000
interpolate: true
run_current: 0.8
#hold_current: 0.5 # run*0.6, round down 0.05

[autotune_tmc stepper_x]
motor: moons-ms14hs5p4150
tuning_goal: performance

[stepper_y]
step_pin: M2_STEP
dir_pin: M2_DIR
enable_pin: !M2_EN
microsteps: 16
rotation_distance: 32
endstop_pin: ^M2_STOP
full_steps_per_rotation:200
position_min: 0
homing_positive_dir: true
homing_retract_dist: 5
position_endstop: 189
position_max: 189
homing_speed: 80#20

#[tmc2209 stepper_y]
#uart_pin: PC10
#sense_resistor: 0.110
[tmc2240 stepper_y]
cs_pin: M2_CS
#spi_bus: spi1
spi_software_sclk_pin: SCLK
spi_software_mosi_pin: MOSI
spi_software_miso_pin: MISO
rref: 12000
interpolate: true
run_current: 0.8

[autotune_tmc stepper_y]
motor: moons-ms14hs5p4150
tuning_goal: performance
pwm_freq_target: 22e3

#####################################################################
# 	Z Motors
#####################################################################

## Z0: front left - on M3A
[stepper_z]
step_pin: M3_STEP
dir_pin: M3_DIR
enable_pin: !M3_EN
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop#^T0:PROBE
#position_endstop: 0
position_max: 290
position_min: -5
homing_speed: 16#8
second_homing_speed: 5
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: M3_CS
interpolate: true
run_current: 0.8
#hold_current: 0.5
sense_resistor: 0.110

[autotune_tmc stepper_z]
motor: omc-17he15-1504s
# tuning_goal: performance
tuning_goal: silent

# Z1: back left - on M4
[stepper_z1]
step_pin: M4_STEP
dir_pin: !M4_DIR
enable_pin: !M4_EN
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32

[tmc2209 stepper_z1]
uart_pin: M4_CS
interpolate: true
run_current: 0.8
#hold_current: 0.5
sense_resistor: 0.110

[autotune_tmc stepper_z1]
motor: omc-17he15-1504s
# tuning_goal: performance
tuning_goal: silent

# Z2: back right - on M5
[stepper_z2]
step_pin: M5_STEP
dir_pin: M5_DIR
enable_pin: !M5_EN
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32

[tmc2209 stepper_z2]
uart_pin: M5_CS
interpolate: true
run_current: 0.8
#hold_current: 0.5
sense_resistor: 0.110

[autotune_tmc stepper_z2]
motor: omc-17he15-1504s
# tuning_goal: performance
tuning_goal: silent

# Z3: front right - on M6
[stepper_z3]
step_pin: M6_STEP
dir_pin: !M6_DIR
enable_pin: !M6_EN
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32

[tmc2209 stepper_z3]
uart_pin: M6_CS
interpolate: true
run_current: 0.8
#hold_current: 0.5
sense_resistor: 0.110

[autotune_tmc stepper_z3]
motor: omc-17he15-1504s
# tuning_goal: performance
tuning_goal: silent

##############
# Heated Bed #
##############

[heater_bed]
heater_pin: HE0
sensor_type:Generic 3950
sensor_pin: THB
max_power: 1
min_temp: 0
max_temp: 120
#control: pid
#pid_kp: 58.437
#pid_ki: 2.347
#pid_kd: 363.769

[bed_mesh]
speed: 120
horizontal_move_z: 10
mesh_min: 13,95
mesh_max: 160,170
zero_reference_position: 90, 110
probe_count: 5,5
algorithm: bicubic
fade_start: 1.0
fade_end: 10
mesh_pps: 2,2

[quad_gantry_level]
speed: 150
horizontal_move_z: 5
retries: 5
retry_tolerance: 0.01
max_adjust: 10
gantry_corners:
  -60.2, -10.4
  244.1, 234.5
points:
  8,85# 8,95
  8,188
  163,188
  163,85 #163,95

[resonance_tester]
accel_chip: adxl345 T1
accel_per_hz: 75
probe_points:
     87,90,20
#max_freq: 150
sweeping_period: 0

[input_shaper]

