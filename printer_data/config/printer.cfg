[include fluidd.cfg]
[include boards/m8pv2.cfg]
[include boards/ebb36.cfg]

[mcu]
canbus_uuid: 1240e1d83c52

[include T0.cfg]

[mcu T1]
canbus_uuid: 2641b8411b76

[virtual_sdcard]
path: /home/brm/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 10000
max_z_velocity: 35
max_z_accel: 350
square_corner_velocity: 5
minimum_cruise_ratio: 0.30

[homing_override]
axes: xyz
gcode: 
#  {% if ('Y' in params or ('X' not in params and 'Y' not in params and 'Z' not in params)) or ('y' not in printer.toolhead.homed_axes and 'X' in params) %}
#    G28 Y
#  {% endif %}
#  {% if 'X' in params or ('X' not in params and 'Y' not in params and 'Z' not in params) %}
#    G90
#    G0 Y190
#    G28 X
#  {% endif %}
#  {% if 'Z' in params or ('X' not in params and 'Y' not in params and 'Z' not in params) %}
#    G90
#    G0 X90 Y90
#    G28 Z
#  {% endif %}
  {% set x = false %}
  {% set y = false %}
  {% set z = false %}
  {% set reapeat_y = false %}
  {% if 'X' in params or ('X' not in params and 'Y' not in params and 'Z' not in params) %}
    {% set x = true %}
  {% endif %}
  {% if 'Y' in params or ('X' not in params and 'Y' not in params and 'Z' not in params) %}
    {% set y = true %}
  {% endif %}
  {% if 'Z' in params or ('X' not in params and 'Y' not in params and 'Z' not in params) %}
    {% set z = true %}
  {% endif %}
  
  {% if (x or y) and 'z' not in printer.toolhead.homed_axes %}
    {% set forced_z = true %}
    SET_KINEMATIC_POSITION Z=0 SET_HOMED=Z
    G91
    G0 Z5
    G90
    {% if x and 'y' in printer.toolhead.homed_axes %}
      {% set repeat_y = true %}
    {% endif %}
    M84
  {% elif 'z' in printer.toolhead.homed_axes %}
    G91
    G0 Z5
    G90
  {% endif %}

  {% if y or ((x or z) and 'y' not in printer.toolhead.homed_axes) or repeat_y %}
    G28 Y
  {% endif %}
  {% if x or (z and not 'x' in printer.toolhead.homed_axes) %}
    G90
    G0 Y{printer.toolhead.axis_maximum.y}
    G28 X
  {% endif %}
  {% if z %}
    G90
    G0 X{printer.toolhead.axis_maximum.x/2} Y{printer.toolhead.axis_maximum.y/2} F12000
    G28 Z
  {% endif %}
    
#######################
# Temperature Sensors #
#######################

[temperature_sensor MCU]
sensor_type: temperature_mcu

[temperature_sensor SoC]
sensor_type: temperature_host

################
# X/Y Steppers #
################

[stepper_x]
step_pin: M1_STEP
dir_pin: M1_DIR
enable_pin: !M1_EN
microsteps: 32
rotation_distance: 32
endstop_pin: ^M1_STOP
full_steps_per_rotation: 200
position_min: 0
homing_positive_dir: true
homing_retract_dist: 5
position_endstop: 173
position_max: 173
homing_speed: 80#20

[tmc2240 stepper_x]
cs_pin: M1_CS
#spi_bus: spi1
spi_software_sclk_pin: SCLK
spi_software_mosi_pin: MOSI
spi_software_miso_pin: MISO
rref: 12000
interpolate: true
run_current: 0.8
#hold_current: 0.5 # run*0.6, round down 0.05

[autotune_tmc stepper_x]
motor: moons-ms14hs5p4150
tuning_goal: performance

[stepper_y]
step_pin: M2_STEP
dir_pin: M2_DIR
enable_pin: !M2_EN
microsteps: 16
rotation_distance: 32
endstop_pin: ^M2_STOP
full_steps_per_rotation:200
position_min: 0
homing_positive_dir: true
homing_retract_dist: 5
position_endstop: 190
position_max: 190
homing_speed: 80#20

#[tmc2209 stepper_y]
#uart_pin: PC10
#sense_resistor: 0.110
[tmc2240 stepper_y]
cs_pin: M2_CS
#spi_bus: spi1
spi_software_sclk_pin: SCLK
spi_software_mosi_pin: MOSI
spi_software_miso_pin: MISO
rref: 12000
interpolate: true
run_current: 0.8

[autotune_tmc stepper_y]
motor: moons-ms14hs5p4150
tuning_goal: performance
pwm_freq_target: 22e3

#####################################################################
# 	Z Motors
#####################################################################

