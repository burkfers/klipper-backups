[include fluidd.cfg]
[include m8pv2.cfg]

[mcu]
canbus_uuid: 1240e1d83c52

[mcu T0]
canbus_uuid: 1b225030602a

[virtual_sdcard]
path: /home/brm/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: corexy
max_velocity: 100
max_accel: 5000
max_z_velocity: 35
max_z_accel: 350
square_corner_velocity: 5
minimum_cruise_ratio: 0.30

#######################
# Temperature Sensors #
#######################

[temperature_sensor MCU]
sensor_type: temperature_mcu

[temperature_sensor SoC]
sensor_type: temperature_host

################
# X/Y Steppers #
################

[stepper_x]
step_pin: M1_STEP
dir_pin: !M1_DIR
enable_pin: !M1_EN
microsteps: 32
rotation_distance: 32
endstop_pin: ^M1_STOP
full_steps_per_rotation: 200
position_min: 0
homing_positive_dir: true
homing_retract_dist: 5
position_endstop: 173
position_max: 173
homing_speed: 20

[tmc2240 stepper_x]
cs_pin: M1_CS
#spi_bus: spi1
spi_software_sclk_pin: SCLK
spi_software_mosi_pin: MOSI
spi_software_miso_pin: MISO
rref: 12000
interpolate: true
run_current: 0.8
#hold_current: 0.5 # run*0.6, round down 0.05

#[autotune_tmc stepper_x]
#motor: moons-ms17hd6p4200 
#tuning_goal: performance
#pwm_freq_target: 22e3

[stepper_y]
step_pin: M2_STEP
dir_pin: !M2_DIR
enable_pin: !M2_EN
microsteps: 16
rotation_distance: 32
endstop_pin: ^M2_STOP
full_steps_per_rotation:200
position_min: 0
homing_positive_dir: true
homing_retract_dist: 5
position_endstop: 300
position_max: 300
homing_speed: 20

#[tmc2209 stepper_y]
#uart_pin: PC10
#sense_resistor: 0.110
[tmc2240 stepper_y]
cs_pin: M2_CS
#spi_bus: spi1
spi_software_sclk_pin: SCLK
spi_software_mosi_pin: MOSI
spi_software_miso_pin: MISO
rref: 12000
interpolate: true
run_current: 0.8

#[autotune_tmc stepper_y]
#motor: moons-ms17hd6p4200 
#tuning_goal: performance
#pwm_freq_target: 22e3

#####################################################################
# 	Z Motors
#####################################################################

## Z0 Stepper - Front Left on MOTOR3_A
[stepper_z]
step_pin: M3_STEP
dir_pin: M3_DIR
enable_pin: !M3_EN
rotation_distance: 32
gear_ratio: 64:16
microsteps: 32
endstop_pin: ^T0:PB5
position_endstop: 0
position_max: 290
position_min: -5
homing_speed: 8
second_homing_speed: 5
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: M3_CS
interpolate: true
run_current: 0.6#0.8
#hold_current: 0.5
sense_resistor: 0.110

#[autotune_tmc stepper_z]
#motor: moons-ms17hd6p4200 
#tuning_goal: performance

