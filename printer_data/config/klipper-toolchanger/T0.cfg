############
# Extruder #
############

[extruder]
step_pin: T0:E_STEP
dir_pin: !T0:E_DIR
enable_pin: !T0:E_EN
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: T0:HE_HEATER
sensor_type: Generic 3950
sensor_pin: T0:HE_TEMP
min_temp: 0
max_temp: 300
microsteps: 16
full_steps_per_rotation: 200	# 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
pressure_advance: 0.05
pressure_advance_smooth_time: 0.040 # this can be calibrated later
rotation_distance: 22.6789511   #Bondtech 5mm Drive Gears
gear_ratio: 50:10               #BMG Gear Ratio
max_extrude_cross_section: 4

[tmc2209 extruder]
uart_pin: T0:E_UART
run_current: 0.650
sense_resistor: 0.110
interpolate: true

[autotune_tmc extruder]
motor: moons-cse14hra1l410a
tuning_goal: performance

###############
# Fan Control #
###############

[fan_generic part_fan_t0]
##	Part Cooling Fan
pin: T0:PC_FAN
kick_start_time: 0.5
##	Depending on your fan, you may need to increase this value
##	if your fan will not start. Can change cycle_time (increase)
##	if your fan is not able to slow down effectively
off_below: 0.10

[heater_fan extruder_fan]
pin: T0:HE_FAN
heater: extruder
heater_temp: 50.0
kick_start_time: 0.75
#max_power: 0.8#1
tachometer_pin: T0:PB5
tachometer_ppr: 2
tachometer_poll_interval: 0.0009

########
# ADXL #
########

[adxl345 T0]
cs_pin: T0:ADXL_CS
spi_software_sclk_pin: T0:ADXL_SCLK
spi_software_mosi_pin: T0:ADXL_MOSI
spi_software_miso_pin: T0:ADXL_MISO
axes_map: x,y,z

#####################################################################
#   Temperature Sensor
#####################################################################

[temperature_sensor T0]
sensor_type: temperature_mcu
sensor_mcu: T0
min_temp: 0
max_temp: 100

#####################################################################
#   gcode_macro T0
#####################################################################

[gcode_macro T0]
variable_color: ""
variable_tool_number: 0
gcode:
  _CHANGE_TOOL T={tool_number}
  _T0 POST=1

[gcode_macro _T0]
gcode:
  {% set pre = params.PRE|default(0)|int %}
  {% set post = params.POST|default(0)|int %}
  {% if pre %}
    _SET_NOZZLE_LEDS TOOL=1 ENABLE=0
    _SET_LOGO_LED TOOL=1 ENABLE=0
  {% endif %}
  {% if post %}
    _SET_NOZZLE_LEDS TOOL=0 ENABLE=1
    _SET_LOGO_LED TOOL=0 ENABLE=1
  {% endif %}


[tool T0]
tool_number: 0
extruder: extruder
#fan: fan_generic part_fan_t0
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0
# Position with the toolhead aligned with the dock
params_park_x: 0.5
params_detach_x: 12#8
params_input_shaper_damp_x: 0.074
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 67.2
params_input_shaper_damp_y: 0.044
params_input_shaper_type_y: '2hump_ei'
params_input_shaper_freq_y: 80.6

[tool_probe T0]
pin: ^T0:PROBE
tool: 0
#z_offset: -0.36
#z_offset: -0.50
z_offset: -0.45
speed: 2.5
lift_speed: 6.0
samples: 3
samples_result: median
sample_retract_dist: 2
samples_tolerance: 0.03
samples_tolerance_retries: 5
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder

#####################################################################
#   RGB
#####################################################################

[neopixel T0_leds]
pin: T0:RGB
chain_count: 3
color_order: GRBW
