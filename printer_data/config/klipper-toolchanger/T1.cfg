############
# Extruder #
############

[extruder1]
step_pin: T1:E_STEP
dir_pin: !T1:E_DIR
enable_pin: !T1:E_EN
microsteps: 16
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: T1:HE_HEATER
sensor_type: Generic 3950
sensor_pin: T1:HE_TEMP
min_temp: 0
max_temp: 300
microsteps: 16
full_steps_per_rotation: 200	# 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 1.75
pressure_advance: 0.05
pressure_advance_smooth_time: 0.040 # this can be calibrated later
rotation_distance: 22.6789511   #Bondtech 5mm Drive Gears
gear_ratio: 50:10               #BMG Gear Ratio

[tmc2209 extruder1]
uart_pin: T1:E_UART
run_current: 0.650
sense_resistor: 0.110
interpolate: true

[autotune_tmc extruder1]
motor: moons-cse14hra1l410a
tuning_goal: performance

###############
# Fan Control #
###############

[fan_generic part_fan_t1]
##	Part Cooling Fan
pin: T1:PC_FAN
kick_start_time: 0.5
##	Depending on your fan, you may need to increase this value
##	if your fan will not start. Can change cycle_time (increase)
##	if your fan is not able to slow down effectively
off_below: 0.10

[heater_fan extruder1_fan]
pin: T1:HE_FAN
heater: extruder1
heater_temp: 50.0
kick_start_time: 0.75
#max_power: 0.8#1
tachometer_pin: T1:PB5
tachometer_ppr: 2
tachometer_poll_interval: 0.0009

#####################################################################
#   Accelerometer
#####################################################################

[adxl345 T1]
cs_pin: T1:ADXL_CS
spi_software_sclk_pin: T1:ADXL_SCLK
spi_software_mosi_pin: T1:ADXL_MOSI
spi_software_miso_pin: T1:ADXL_MISO
axes_map: x,y,z

#####################################################################
#   Temperature Sensor
#####################################################################

[temperature_sensor T1]
sensor_type: temperature_mcu
sensor_mcu: T1
min_temp: 0
max_temp: 100

#####################################################################
#   gcode_macro T1
#####################################################################

[gcode_macro T1]
variable_color: ""
variable_tool_number: 1
gcode:
  _SET_NOZZLE_LEDS TOOL=0 ENABLE=0
  _SET_LOGO_LED TOOL=0 ENABLE=0
  _CHANGE_TOOL T={tool_number}
  _SET_NOZZLE_LEDS TOOL=1 ENABLE=1
  _SET_LOGO_LED TOOL=1 ENABLE=1

[tool T1]
tool_number: 1
extruder: extruder1
#fan: fan_generic part_fan_t1
gcode_x_offset: 0
gcode_y_offset: 0
gcode_z_offset: 0
# Position with the toolhead aligned with the dock
params_park_x: 171
params_detach_x: 166
params_input_shaper_damp_x: 0.043
params_input_shaper_type_x: 'mzv'
params_input_shaper_freq_x: 68.0
params_input_shaper_damp_y: 0.038
params_input_shaper_type_y: '2HUMP_EI'
params_input_shaper_freq_y: 80.2
#detection_pin: toolboard_1: PB6

[tool_probe T1]
pin: ^T1:PROBE
tool: 1
z_offset: -0.66
speed: 3
samples: 3
samples_result: median
sample_retract_dist: 1.0
samples_tolerance: 0.01
samples_tolerance_retries: 5
activate_gcode:
    _TAP_PROBE_ACTIVATE HEATER=extruder1

#####################################################################
#   RGB
#####################################################################

[neopixel T1_leds]
pin: T1:RGB
chain_count: 3
color_order: GRBW
