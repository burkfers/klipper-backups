#####################################################################
# 	A/B Motors
#####################################################################

## X Stepper on Motor1(B Motor)
[stepper_x]
step_pin: M1_STEP
dir_pin: M1_DIR
enable_pin: !M1_EN
microsteps: 64
rotation_distance: 40
full_steps_per_rotation:200  #set to 400 for 0.9 degree stepper
position_min: 0
position_endstop: 296
position_max: 296
homing_speed: 70  #Max 100
homing_retract_dist: 5
homing_positive_dir: true
endstop_pin: ^M1_STOP

[tmc2240 stepper_x]
cs_pin: M1_CS
spi_software_sclk_pin: SCLK
spi_software_mosi_pin: MOSI
spi_software_miso_pin: MISO
rref: 12000
interpolate: true
run_current: 1.4

[autotune_tmc stepper_x]
motor: omc-17hs19-2504s-h
tuning_goal: performance
voltage: 36
extra_hysteresis: 2

## Y Stepper on Motor2 (A Motor)
[stepper_y]
step_pin: M2_STEP
dir_pin: M2_DIR
enable_pin: !M2_EN
microsteps: 64
rotation_distance: 40
full_steps_per_rotation:200
endstop_pin: ^M2_STOP
position_min: 0
position_endstop: 309#304
position_max: 309#304
homing_speed: 70   #Max 100
homing_retract_dist: 5
homing_positive_dir: true

[tmc2240 stepper_y]
cs_pin: M2_CS
#spi_bus: spi1
spi_software_sclk_pin: SCLK
spi_software_mosi_pin: MOSI
spi_software_miso_pin: MISO
rref: 12000
interpolate: true
run_current: 1.4

[autotune_tmc stepper_y]
motor: omc-17hs19-2504s-h
tuning_goal: performance
voltage: 36
extra_hysteresis: 2

#####################################################################
# 	Z Motors
#####################################################################

## Z0 Stepper - Front Left on MOTOR3_A
[stepper_z]
step_pin: M5_STEP
dir_pin: M5_DIR
enable_pin: !M5_EN
rotation_distance: 40
gear_ratio: 80:16
microsteps: 32
endstop_pin: probe:z_virtual_endstop
position_max: 290
position_min: -5
homing_speed: 10 #8
second_homing_speed: 5
homing_retract_dist: 0 # must be 0 for cartographer survey touch

[tmc2209 stepper_z]
uart_pin: M5_CS
interpolate: true
run_current: 0.6#0.8
#hold_current: 0.5
sense_resistor: 0.110

[autotune_tmc stepper_z]
motor: moons-ms17hd6p4200 
tuning_goal: performance

